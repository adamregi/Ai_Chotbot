name: Keep-Alive Ping

on:
  schedule:
    # Run every 10 minutes to prevent free-tier hosting (Render, Koyeb, etc.) from sleeping
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Service
        env:
          SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL || secrets.API_URL }}
        run: |
          if [ -z "$SERVICE_URL" ]; then
            echo "::error::Neither RENDER_SERVICE_URL nor API_URL secret is configured. Please add your backend URL in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          TARGET_URL="${SERVICE_URL%/}"

          echo "Pinging backend health endpoint at $(date -u)..."

          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -m 45 --retry 2 "${TARGET_URL}/health" || echo "FAILED")

          echo "HTTP Status: $HTTP_STATUS"
          if [ -f response.txt ]; then
            echo "Response: $(cat response.txt)"
          fi

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Service is healthy and awake!"
          else
            echo "::warning::Health endpoint returned status $HTTP_STATUS"
          fi
